name: Claude PR Review

# Runs a Claude Code review on every PR when it's opened or marked ready
# for review — deliberately NOT on every push, to keep API costs at one
# review per PR. For a re-review after pushing fixes, re-run the job from
# the Actions tab (or close/reopen the PR).
#
# Authenticates with a Claude Pro/Max subscription via an OAuth token
# (no Anthropic Console account, no separate API billing). Generate the
# token locally with `claude setup-token`, then store it as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret
# (Settings → Secrets and variables → Actions).

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post a live-updating progress comment while the review runs.
          track_progress: true
          prompt: |
            Review this pull request.

            Follow the review policy in REVIEW.md at the repository root
            (severity definitions, nit cap, skip rules, summary shape).
            CLAUDE.md provides project context and conventions.

            Read the full diff against the base branch, and enough of the
            surrounding code to verify each finding — behavior claims need
            a file:line citation, not an inference from naming.

            Post findings as inline PR comments on the relevant lines, and
            finish with one summary comment following the summary shape in
            REVIEW.md. If you find no issues, say so briefly instead of
            inventing findings.

          # Without this allowlist the review still runs, but every attempt to
          # post is denied (Claude can read the PR, not write to it). These
          # tools let it post inline comments on lines and a summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
